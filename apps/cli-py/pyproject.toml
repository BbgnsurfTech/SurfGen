[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surfgen-cli"
version = "0.1.0"
description = "SurfGen Python CLI — provider-agnostic AI video generation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
surfgen-py = "surfgen_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["surfgen_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
