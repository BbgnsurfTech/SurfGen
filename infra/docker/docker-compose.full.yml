# SurfGen full stack — everything containerized, from the repo root:
#
#   docker compose -f infra/docker/docker-compose.full.yml up --build
#
# Profiles (opt-in):
#   --profile observability   prometheus + grafana + jaeger
#   --profile ollama          local LLM server (config/ai.yaml picks it up via discovery)
#
# Zero-credential by default: the pipeline renders with Piper/FFmpeg/mocks.
# Cloud providers activate by exporting their API keys and enabling the
# corresponding config/ai.yaml entries — no code or image changes.
name: surfgen

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://surfgen:${POSTGRES_PASSWORD:-surfgen-dev}@postgres:5432/surfgen
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AMQP_URL: amqp://surfgen:${RABBITMQ_PASSWORD:-surfgen-dev}@rabbitmq:5672
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  # Set COOKIE_SECURE=false ONLY for plain-http trials (e.g. http://<ip>:3000)
  # — browsers reject Secure cookies over http on non-localhost hosts.
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  SURFGEN_S3_ACCESS_KEY: ${MINIO_USER:-surfgen}
  SURFGEN_S3_SECRET_KEY: ${MINIO_PASSWORD:-surfgen-dev}
  SURFGEN_STORAGE__DRIVER: s3
  SURFGEN_STORAGE__ENDPOINT: http://minio:9000
  SURFGEN_STORAGE__BUCKET: surfgen
  SURFGEN_STORAGE__FORCEPATHSTYLE: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  # ------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surfgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surfgen-dev}
      POSTGRES_DB: surfgen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfgen"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: surfgen
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-surfgen-dev}
    ports:
      - "15672:15672" # management UI
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-surfgen}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-surfgen-dev}
    ports:
      - "9001:9001" # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_USER:-surfgen} ${MINIO_PASSWORD:-surfgen-dev} &&
      mc mb --ignore-existing local/surfgen &&
      exit 0"

  # ----------------------------------------------------------------- migration
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: build
    command: >
      /bin/sh -c "pnpm --filter @surfgen/db exec prisma migrate deploy ||
                  pnpm --filter @surfgen/db exec prisma db push"
    environment:
      DATABASE_URL: postgresql://surfgen:${POSTGRES_PASSWORD:-surfgen-dev}@postgres:5432/surfgen
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------- applications
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      <<: *app-env
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      <<: *app-env
      # Single-worker stack serves every resource class — the "gpu" queues are
      # scheduling labels; local reference providers (piper/ffmpeg) run on CPU.
      WORKER_QUEUES: cpu.default,cpu.media,gpu.default,gpu.heavy,io.webhooks,io.analytics
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      replicas: 2

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Baked into the client bundle — must be reachable from the browser.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # ------------------------------------------------- profile: observability
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-surfgen-dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3300:3000"
    depends_on:
      - prometheus

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP http — point OTEL_EXPORTER_OTLP_ENDPOINT here

  # -------------------------------------------------------- profile: ollama
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
  promdata:
  grafanadata:
  ollamadata:
