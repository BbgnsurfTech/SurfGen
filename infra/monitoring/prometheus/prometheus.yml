global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: surfgen-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: api

  # Workers expose /metrics on 9464 (telemetry package default).
  - job_name: surfgen-worker
    static_configs:
      - targets: ["worker:9464"]
        labels:
          service: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
