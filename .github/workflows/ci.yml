name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install ffmpeg (render integration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @surfgen/db generate

      - name: Turbo — lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

  integration:
    name: Integration (Postgres · Redis · RabbitMQ · MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surfgen
          POSTGRES_PASSWORD: surfgen-dev
          POSTGRES_DB: surfgen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surfgen"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://surfgen:surfgen-dev@127.0.0.1:5432/surfgen
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate (validates schema against real Postgres)
        run: pnpm --filter @surfgen/db exec prisma migrate deploy || pnpm --filter @surfgen/db exec prisma db push

      - name: Seed
        run: pnpm --filter @surfgen/db seed
        env:
          SEED_PRINT_SECRETS: "0"

      - name: Integration test suite
        run: pnpm turbo test --filter=@surfgen/integration

  docker:
    name: Docker build (api + worker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint infra/k8s/helm/surfgen
      - name: Render templates (default values)
        run: helm template surfgen infra/k8s/helm/surfgen > /dev/null
