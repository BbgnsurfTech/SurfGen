# OWASP ZAP baseline rule configuration for SurfGen.
# Usage: zap-baseline.py -t <target> -c zap-baseline.conf
#
# Format: <rule-id><TAB><IGNORE|WARN|FAIL><TAB><comment>
# Unlisted rules keep the zap-baseline default (WARN).
#
# The API (http://localhost:4000) serves JSON only; helmet is registered in
# apps/api/src/main.ts with contentSecurityPolicy deliberately disabled
# ("API responses are JSON; CSP is set by the web app"). Several browser-page
# rules are therefore expected noise on the API target — each IGNORE below
# records why it is acceptable. Re-review these whenever the API starts
# serving HTML beyond the Swagger UI at /docs.

# --- Accepted / by-design ---------------------------------------------------

# ISO-8601 timestamps (createdAt/updatedAt/finishedAt) appear in every API
# envelope by design; this rule false-positives on epoch-like numbers too.
10096	IGNORE	(Timestamp Disclosure)

# Fires on comments inside minified Next.js/Swagger-UI bundles; no secrets
# are embedded in client bundles (enforced by review + pnpm audit).
10027	IGNORE	(Information Disclosure - Suspicious Comments)

# Informational fingerprint ("this looks like a SPA") — not a vulnerability.
10109	IGNORE	(Modern Web Application)

# CSP is intentionally not set on the JSON API (helmet CSP disabled in
# main.ts); the Next.js web app owns CSP for browser-rendered pages.
# Keep this at WARN (not IGNORE) so a scan of the web app still surfaces it.
10038	WARN	(Content Security Policy (CSP) Header Not Set)

# Local compose stack terminates plain HTTP; HSTS is an ingress/proxy concern
# in production (see rules in .claude and infra/k8s), so a local scan cannot
# observe it. WARN keeps it visible without failing local runs.
10035	WARN	(Strict-Transport-Security Header Not Set)

# Dev CORS is permissive when CORS_ORIGINS is unset (main.ts falls back to
# origin: true). Production must set CORS_ORIGINS — keep visible as WARN.
10098	WARN	(Cross-Domain Misconfiguration)

# Public marketing/doc pages are cacheable on purpose; authenticated API
# responses carry no-store semantics via the browser client. WARN to audit.
10049	WARN	(Storable and Cacheable Content)

# COOP/COEP isolation headers are a web-app/ingress hardening follow-up, not
# an API regression — track without failing the baseline.
90004	WARN	(Insufficient Site Isolation Against Spectre Vulnerability)

# Permissions-Policy is meaningless for a JSON API; the web app should set it
# (documented in the security rules). WARN so web scans keep flagging it.
10063	WARN	(Permissions Policy Header Not Set)

# --- Must never regress (fail the scan) -------------------------------------

# helmet sets X-Content-Type-Options: nosniff on every API response.
10021	FAIL	(X-Content-Type-Options Header Missing)

# No debug/error leakage: the domain exception filter maps errors to the
# envelope without stack traces.
90022	FAIL	(Application Error Disclosure)

# Auth uses httpOnly SameSite=Strict refresh cookie (auth.controller.ts);
# a cookie without HttpOnly appearing anywhere is a regression.
10010	FAIL	(Cookie No HttpOnly Flag)
10054	FAIL	(Cookie without SameSite Attribute)
